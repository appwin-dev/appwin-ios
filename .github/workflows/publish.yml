name: Publish

# This file lives in the monorepo under `sdk/appwin-ios/` and runs only in the
# published mirror (same travel mechanism as ci.yml). It fires on the release
# tag that `sdk/scripts/release.mjs --push` creates, so publishing needs no
# workstation credential.
#
# One repository secret:
#   COCOAPODS_TRUNK_TOKEN - trunk session token of the Appwin account
#     (run `pod trunk register`, click the email link, then copy the
#     `password` field from ~/.netrc)

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}

jobs:
  # Same validation as a push to main: publishing waits for green.
  checks:
    uses: ./.github/workflows/ci.yml
  pods:
    needs: checks
    name: CocoaPods trunk
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate trunk
        run: |
          printf 'machine trunk.cocoapods.org\n  login lesignobles.studio@gmail.com\n  password %s\n' \
            "${{ secrets.COCOAPODS_TRUNK_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          pod trunk me

      # Order matters: every other pod depends on AppwinCore, and trunk
      # validates a spec against what the CDN already serves. The retry
      # absorbs the CDN propagation delay after each push, and an
      # already-published version (workflow re-run) is not an error.
      - name: Push the podspecs
        run: |
          # From the podspec, not the git ref: workflow_dispatch runs from
          # a branch, and the specs are the publication's source of truth.
          VERSION="$(sed -n "s/.*s\.version[[:space:]]*=[[:space:]]*'\([0-9.]*\)'.*/\1/p" AppwinCore.podspec | head -1)"
          echo "publishing $VERSION"
          for spec in AppwinCore AppwinSupport AppwinCommunity AppwinNotifications AppwinAnalytics AppwinAttribution; do
            if pod trunk info "$spec" 2>/dev/null | grep -q "^ *- $VERSION "; then
              echo "$spec $VERSION already on trunk, skipping"
              continue
            fi
            for attempt in 1 2 3 4 5; do
              # `| tee` would mask the push exit code with tee's own (always
              # 0): capture the status explicitly. A GitHub-API timeout on
              # trunk once reported "success" while nothing was published.
              pod trunk push "$spec.podspec" --synchronous --allow-warnings 2>&1 | tee push.log
              status=${PIPESTATUS[0]}
              if [ "$status" = 0 ]; then
                break
              # A push can land server-side while failing client-side: the
              # retry then hits "duplicate entry", which IS the success.
              elif grep -q "duplicate entry" push.log; then
                echo "$spec $VERSION already accepted by trunk, continuing"
                break
              elif [ "$attempt" = 5 ]; then
                echo "$spec failed after 5 attempts"; exit 1
              else
                echo "retrying $spec in 90s (attempt $attempt failed)"; sleep 90
              fi
            done
          done
